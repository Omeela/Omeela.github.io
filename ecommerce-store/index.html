<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Market | Portfolio Project</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Arial;background:#0b1020;color:#e9edff}header{padding:20px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #28304b;gap:16px;flex-wrap:wrap}a{color:#c4b5fd}main{max-width:1150px;margin:auto;padding:32px 22px}h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px}p{color:#aab4cf}button,input,select{font:inherit}button{cursor:pointer;background:#8b5cf6;border:0;color:white;border-radius:10px;padding:11px 17px}button:hover{filter:brightness(1.15)}input,select{padding:11px;border:1px solid #3b4566;background:#121a31;color:#fff;border-radius:10px;max-width:100%}.panel{background:#151d35;border:1px solid #303b5d;border-radius:18px;padding:22px}.muted{color:#aab4cf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stat{font-size:30px;font-weight:800}.pill{border-radius:999px;background:#31335c;padding:4px 9px;font-size:12px}footer{padding:30px;text-align:center;color:#aab4cf}.products{margin-top:20px}.product{overflow:hidden}.art{height:145px;display:grid;place-items:center;font-size:62px;background:linear-gradient(135deg,#30244d,#182c50);border-radius:12px}.product h3{margin:13px 0 4px}.price{font-size:22px;font-weight:800}.cartitem{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #303b5d}.checkout{margin-top:15px;width:100%}.top{display:grid;grid-template-columns:2fr 1fr;gap:22px}@media(max-width:800px){.top{grid-template-columns:1fr}}</style></head><body><header><strong>Nova Market</strong><a href="../">← Portfolio</a></header><main><h1>Find something you love.</h1><p>A responsive demo storefront with product discovery, sorting, and a working local shopping cart. No real purchases or payments.</p><section class="top"><div><div class="row"><input id="search" placeholder="Search products..." aria-label="Search products"><select id="category"><option>All categories</option><option>Tech</option><option>Home</option><option>Style</option></select><select id="sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div class="grid products" id="products"></div></div><aside class="panel"><h2>Shopping cart <span id="count" class="pill">0</span></h2><div id="cart"></div><h3 id="total">Total: $0.00</h3><button class="checkout" id="checkout">Demo checkout</button><p id="notice" role="status"></p></aside></section></main><footer>Interactive demo project · Built for the web developer portfolio</footer><script>const products=[{id:1,name:'Studio Headphones',cat:'Tech',price:89,icon:'🎧'},{id:2,name:'Minimal Desk Lamp',cat:'Home',price:54,icon:'💡'},{id:3,name:'Everyday Backpack',cat:'Style',price:72,icon:'🎒'},{id:4,name:'Wireless Keyboard',cat:'Tech',price:64,icon:'⌨️'},{id:5,name:'Ceramic Coffee Set',cat:'Home',price:38,icon:'☕'},{id:6,name:'Classic Wristwatch',cat:'Style',price:119,icon:'⌚'}];const key='nova-cart-v1';let cart={};try{cart=JSON.parse(localStorage.getItem(key)||'{}')}catch{};const money=n=>'$'+n.toFixed(2);function render(){const q=document.getElementById('search').value.toLowerCase(),cat=document.getElementById('category').value,sort=document.getElementById('sort').value;let list=products.filter(p=>p.name.toLowerCase().includes(q)&&(cat==='All categories'||p.cat===cat));if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='high')list.sort((a,b)=>b.price-a.price);document.getElementById('products').innerHTML=list.map(p=>'<article class="panel product"><div class="art" aria-hidden="true">'+p.icon+'</div><h3>'+p.name+'</h3><p>'+p.cat+'</p><div class="row" style="justify-content:space-between"><span class="price">'+money(p.price)+'</span><button data-add="'+p.id+'">Add +</button></div></article>').join('')||'<p>No products found.</p>';const items=products.filter(p=>cart[p.id]>0);document.getElementById('count').textContent=items.reduce((n,p)=>n+cart[p.id],0);document.getElementById('cart').innerHTML=items.map(p=>'<div class="cartitem"><div>'+p.name+'<div class="muted">'+money(p.price)+' × '+cart[p.id]+'</div></div><div class="row"><button data-minus="'+p.id+'">−</button><button data-add="'+p.id+'">+</button></div></div>').join('')||'<p>Your cart is empty.</p>';document.getElementById('total').textContent='Total: '+money(items.reduce((n,p)=>n+p.price*cart[p.id],0));localStorage.setItem(key,JSON.stringify(cart))}document.body.addEventListener('click',e=>{const add=e.target.closest('[data-add]'),minus=e.target.closest('[data-minus]');if(add)cart[add.dataset.add]=(cart[add.dataset.add]||0)+1;if(minus)cart[minus.dataset.minus]=Math.max(0,(cart[minus.dataset.minus]||0)-1);if(add||minus){document.getElementById('notice').textContent='';render()}});['search','category','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));document.getElementById('checkout').onclick=()=>document.getElementById('notice').textContent='This is a portfolio demo. No payment will be collected.';render();</script></body></html>
