<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkyCast | Portfolio Project</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Arial;background:#0b1020;color:#e9edff}header{padding:20px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #28304b;gap:16px;flex-wrap:wrap}a{color:#c4b5fd}main{max-width:1150px;margin:auto;padding:32px 22px}h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px}p{color:#aab4cf}button,input,select{font:inherit}button{cursor:pointer;background:#8b5cf6;border:0;color:white;border-radius:10px;padding:11px 17px}button:hover{filter:brightness(1.15)}input,select{padding:11px;border:1px solid #3b4566;background:#121a31;color:#fff;border-radius:10px;max-width:100%}.panel{background:#151d35;border:1px solid #303b5d;border-radius:18px;padding:22px}.muted{color:#aab4cf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stat{font-size:30px;font-weight:800}.pill{border-radius:999px;background:#31335c;padding:4px 9px;font-size:12px}footer{padding:30px;text-align:center;color:#aab4cf}.heroWeather{background:linear-gradient(125deg,#273d7b,#6d48aa);margin:22px 0}.big{font-size:clamp(46px,8vw,76px);font-weight:800}.forecast{margin-top:18px}.forecast .panel{text-align:center}.forecast .emoji{font-size:34px}.error{color:#fda4af}#chart{width:100%;height:180px}#chart polyline{fill:none;stroke:#a78bfa;stroke-width:3}#chart circle{fill:#e9d5ff}</style></head><body><header><strong>SkyCast</strong><a href="../">← Portfolio</a></header><main><h1>Weather, beautifully simple.</h1><p>Search any city for live weather and a five-day forecast, powered by the free Open-Meteo API.</p><form id="form" class="row"><input id="city" required placeholder="Enter a city (e.g. Dallas)" value="Dallas"><button id="go">Check weather</button></form><p id="message" role="status"></p><section class="panel heroWeather" id="current"><p>Enter a city to load weather.</p></section><h2>Five-day forecast</h2><div id="forecast" class="grid forecast"></div><section class="panel" style="margin-top:20px"><h2>Daily high temperature trend</h2><svg id="chart" viewBox="0 0 600 180" role="img" aria-label="Daily high temperature trend"></svg></section></main><footer>Interactive demo project · Built for the web developer portfolio</footer><script>const $=id=>document.getElementById(id);const code=n=>n===0?'☀️':n<=3?'🌤️':n<=48?'☁️':n<=67?'🌧️':n<=77?'❄️':n<=82?'🌦️':n<=86?'🌨️':'⛈️';const desc=n=>n===0?'Clear sky':n<=3?'Partly cloudy':n<=48?'Cloudy or foggy':n<=67?'Rain':n<=77?'Snow':n<=82?'Showers':n<=86?'Snow showers':'Thunderstorms';async function load(city){$('message').textContent='Loading weather...';$('go').disabled=true;try{const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=en&format=json');if(!g.ok)throw Error('City search unavailable');const geo=await g.json();if(!geo.results?.length)throw Error('City not found. Try another city name.');const p=geo.results[0];const u='https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=celsius&timezone=auto&forecast_days=5';const r=await fetch(u);if(!r.ok)throw Error('Weather service unavailable');const w=await r.json(),c=w.current,d=w.daily;$('current').innerHTML='<h2>'+p.name+', '+(p.country||'')+'</h2><div class="big">'+code(c.weather_code)+' '+Math.round(c.temperature_2m)+'°C</div><p style="color:white">'+desc(c.weather_code)+' · Feels like '+Math.round(c.apparent_temperature)+'°C</p><div class="row"><span class="pill">Humidity '+c.relative_humidity_2m+'%</span><span class="pill">Wind '+Math.round(c.wind_speed_10m)+' km/h</span></div>';$('forecast').innerHTML=d.time.map((date,i)=>'<article class="panel"><strong>'+new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</strong><div class="emoji">'+code(d.weather_code[i])+'</div><div>'+Math.round(d.temperature_2m_max[i])+'° / '+Math.round(d.temperature_2m_min[i])+'°C</div><p>'+desc(d.weather_code[i])+'</p></article>').join('');const v=d.temperature_2m_max,lo=Math.min(...v)-2,hi=Math.max(...v)+2;const points=v.map((n,i)=>(35+i*132.5)+','+(145-(n-lo)/(hi-lo)*110)).join(' ');$('chart').innerHTML='<polyline points="'+points+'"/>'+v.map((n,i)=>'<circle cx="'+(35+i*132.5)+'" cy="'+(145-(n-lo)/(hi-lo)*110)+'" r="5"/><text fill="#e9edff" text-anchor="middle" x="'+(35+i*132.5)+'" y="168">'+Math.round(n)+'°C</text>').join('');$('message').textContent='Updated weather for '+p.name+'.'}catch(e){$('message').textContent=e.message;$('message').className='error'}finally{$('go').disabled=false}}$('form').onsubmit=e=>{e.preventDefault();load($('city').value.trim())};load('Dallas');</script></body></html>
