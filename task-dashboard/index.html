<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowBoard | Portfolio Project</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Arial;background:#0b1020;color:#e9edff}header{padding:20px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #28304b;gap:16px;flex-wrap:wrap}a{color:#c4b5fd}main{max-width:1150px;margin:auto;padding:32px 22px}h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px}p{color:#aab4cf}button,input,select{font:inherit}button{cursor:pointer;background:#8b5cf6;border:0;color:white;border-radius:10px;padding:11px 17px}button:hover{filter:brightness(1.15)}input,select{padding:11px;border:1px solid #3b4566;background:#121a31;color:#fff;border-radius:10px;max-width:100%}.panel{background:#151d35;border:1px solid #303b5d;border-radius:18px;padding:22px}.muted{color:#aab4cf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stat{font-size:30px;font-weight:800}.pill{border-radius:999px;background:#31335c;padding:4px 9px;font-size:12px}footer{padding:30px;text-align:center;color:#aab4cf}.toolbar{margin:25px 0;display:flex;gap:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:190px}.task{padding:16px;background:#10182d;border:1px solid #303b5d;border-radius:13px;margin-top:12px}.task h3{margin:4px 0}.task.done{opacity:.55}.task.done h3{text-decoration:line-through}.task button{padding:7px 10px;font-size:13px}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}@media(max-width:750px){.columns{grid-template-columns:1fr}}</style></head><body><header><strong>FlowBoard</strong><a href="../">← Portfolio</a></header><main><h1>Make progress visible.</h1><p>Organize work across To Do, In Progress, and Done. Tasks are saved in your browser.</p><section class="grid"><div class="panel"><div class="muted">Total tasks</div><div class="stat" id="total">0</div></div><div class="panel"><div class="muted">Completed</div><div class="stat" id="completed">0</div></div><div class="panel"><div class="muted">Completion rate</div><div class="stat" id="rate">0%</div></div></section><form class="toolbar" id="form"><input id="name" placeholder="What needs to get done?" required maxlength="100"><select id="priority"><option>Medium</option><option>High</option><option>Low</option></select><input id="due" type="date" aria-label="Due date"><button>Add task</button></form><div class="toolbar"><input id="search" placeholder="Search tasks..." aria-label="Search tasks"><select id="filter"><option>All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div><div class="columns" id="board"></div></main><footer>Interactive demo project · Built for the web developer portfolio</footer><script>const key='flowboard-tasks-v1';let tasks=[];try{tasks=JSON.parse(localStorage.getItem(key)||'[]')}catch{};if(!Array.isArray(tasks))tasks=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(key,JSON.stringify(tasks));render()};function render(){const done=tasks.filter(t=>t.status==='Done').length;document.getElementById('total').textContent=tasks.length;document.getElementById('completed').textContent=done;document.getElementById('rate').textContent=(tasks.length?Math.round(done/tasks.length*100):0)+'%';const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;document.getElementById('board').innerHTML=['To Do','In Progress','Done'].map(status=>'<section class="panel"><h2>'+status+'</h2>'+tasks.filter(t=>t.status===status&&t.name.toLowerCase().includes(q)&&(f==='All priorities'||f===t.priority)).map(t=>'<article class="task '+(status==='Done'?'done':'')+'"><span class="pill">'+esc(t.priority)+' priority</span><h3>'+esc(t.name)+'</h3><div class="muted">'+(t.due?'Due '+esc(t.due):'No due date')+'</div><div class="row" style="margin-top:12px"><button data-id="'+t.id+'" data-action="move">Move →</button><button data-id="'+t.id+'" data-action="delete" style="background:#65334c">Delete</button></div></article>').join('')+'</section>').join('')}document.getElementById('form').onsubmit=e=>{e.preventDefault();const n=document.getElementById('name');tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:n.value.trim(),priority:document.getElementById('priority').value,due:document.getElementById('due').value,status:'To Do'});n.value='';save()};document.getElementById('board').onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;const t=tasks.find(x=>x.id===b.dataset.id);if(!t)return;if(b.dataset.action==='delete')tasks=tasks.filter(x=>x.id!==t.id);else t.status={'To Do':'In Progress','In Progress':'Done','Done':'To Do'}[t.status];save()};document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;render();</script></body></html>
